server:
    port: 8080

spring:
    application:
        name: "api"

    devtools:
        add-properties: false

    profiles:
        include: null

    jackson:
        deserialization:
            accept-float-as-int: false

    sql:
        init:
            mode: always

management:
    endpoints:
        web:
            exposure:
                include: "health,prometheus"

    endpoint:
        health:
            probes:
                enabled: true
cors:
    allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
    r2dbc:
        host: ${DB_HOST}
        port: ${DB_PORT}
        database: ${DB_NAME}
        schema: public
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}

resilience:
    persistence:
        timeout: 2s
        retry:
            max-attempts: 3
            backoff: 200ms
        circuit-breaker:
            failure-rate-threshold: 50
            sliding-window-size: 10
            minimum-number-of-calls: 5
            wait-duration-in-open-state: 10s
            permitted-number-of-calls-in-half-open-state: 3

springdoc:
    swagger-ui:
        url: /openapi.yaml
