server:
    port: 8080

spring:
    application:
        name: "api"

    devtools:
        add-properties: false

    profiles:
        include: null

    jackson:
        deserialization:
            accept-float-as-int: false

    sql:
        init:
            mode: always

management:
    endpoints:
        web:
            exposure:
                include: "health,prometheus"

    endpoint:
        health:
            probes:
                enabled: true
cors:
    allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
    r2dbc:
        host: ${DB_HOST}
        port: ${DB_PORT}
        database: ${DB_NAME}
        schema: public
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
